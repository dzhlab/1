<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Соревнования по художественной гимнастике</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎀 Система управления соревнованиями по художественной гимнастике</h1>
        </header>

        <nav class="tabs">
            <button class="tab-button active" onclick="showTab('participants')">Участники</button>
            <button class="tab-button" onclick="showTab('competitions')">Соревнования</button>
            <button class="tab-button" onclick="showTab('scoring')">Оценки</button>
            <button class="tab-button" onclick="showTab('results')">Результаты</button>
        </nav>

        <!-- Вкладка: Участники -->
        <div id="participants" class="tab-content active">
            <h2>Регистрация участников</h2>
            <form id="participantForm" class="form-card">
                <div class="form-group">
                    <label for="participantName">ФИО гимнастки:</label>
                    <input type="text" id="participantName" required>
                </div>
                <div class="form-group">
                    <label for="participantAge">Возраст:</label>
                    <input type="number" id="participantAge" min="5" max="30" required>
                </div>
                <div class="form-group">
                    <label for="participantClub">Клуб/Школа:</label>
                    <input type="text" id="participantClub" required>
                </div>
                <div class="form-group">
                    <label for="participantCategory">Категория:</label>
                    <select id="participantCategory" required>
                        <option value="">Выберите категорию</option>
                        <option value="junior">Юниоры (до 12 лет)</option>
                        <option value="youth">Молодежь (13-15 лет)</option>
                        <option value="senior">Взрослые (16+ лет)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Зарегистрировать участника</button>
            </form>

            <div class="participants-list">
                <h3>Список участников</h3>
                <div id="participantsList"></div>
            </div>
        </div>

        <!-- Вкладка: Соревнования -->
        <div id="competitions" class="tab-content">
            <h2>Управление соревнованиями</h2>
            <form id="competitionForm" class="form-card">
                <div class="form-group">
                    <label for="competitionName">Название соревнования:</label>
                    <input type="text" id="competitionName" required>
                </div>
                <div class="form-group">
                    <label for="competitionDate">Дата проведения:</label>
                    <input type="date" id="competitionDate" required>
                </div>
                <div class="form-group">
                    <label for="competitionCategory">Категория участников:</label>
                    <select id="competitionCategory" required>
                        <option value="">Выберите категорию</option>
                        <option value="junior">Юниоры (до 12 лет)</option>
                        <option value="youth">Молодежь (13-15 лет)</option>
                        <option value="senior">Взрослые (16+ лет)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Дисциплины:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="discipline" value="rope"> Скакалка</label>
                        <label><input type="checkbox" name="discipline" value="hoop"> Обруч</label>
                        <label><input type="checkbox" name="discipline" value="ball"> Мяч</label>
                        <label><input type="checkbox" name="discipline" value="clubs"> Булавы</label>
                        <label><input type="checkbox" name="discipline" value="ribbon"> Лента</label>
                        <label><input type="checkbox" name="discipline" value="free"> Без предмета</label>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Создать соревнование</button>
            </form>

            <div class="competitions-list">
                <h3>Активные соревнования</h3>
                <div id="competitionsList"></div>
            </div>
        </div>

        <!-- Вкладка: Оценки -->
        <div id="scoring" class="tab-content">
            <h2>Выставление оценок</h2>

            <div class="form-card">
                <div class="form-group">
                    <label for="selectCompetition">Выберите соревнование:</label>
                    <select id="selectCompetition" onchange="loadCompetitionForScoring()">
                        <option value="">-- Выберите соревнование --</option>
                    </select>
                </div>
            </div>

            <div id="scoringArea" style="display: none;">
                <div class="form-card">
                    <div class="form-group">
                        <label for="selectParticipant">Выберите участника:</label>
                        <select id="selectParticipant">
                            <option value="">-- Выберите участника --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="selectDiscipline">Выберите дисциплину:</label>
                        <select id="selectDiscipline">
                            <option value="">-- Выберите дисциплину --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="scoreExecution">Техника исполнения (E-score, 0-10):</label>
                        <input type="number" id="scoreExecution" min="0" max="10" step="0.1">
                    </div>
                    <div class="form-group">
                        <label for="scoreDifficulty">Сложность (D-score, 0-10):</label>
                        <input type="number" id="scoreDifficulty" min="0" max="10" step="0.1">
                    </div>
                    <div class="form-group">
                        <label for="scoreArtistry">Артистизм (A-score, 0-10):</label>
                        <input type="number" id="scoreArtistry" min="0" max="10" step="0.1">
                    </div>
                    <div class="total-score">
                        <strong>Общая оценка: <span id="totalScore">0.0</span></strong>
                    </div>
                    <button onclick="submitScore()" class="btn btn-primary">Сохранить оценку</button>
                </div>

                <div class="scores-list">
                    <h3>Выставленные оценки</h3>
                    <div id="scoresList"></div>
                </div>
            </div>
        </div>

        <!-- Вкладка: Результаты -->
        <div id="results" class="tab-content">
            <h2>Результаты соревнований</h2>

            <div class="form-card">
                <div class="form-group">
                    <label for="selectCompetitionResults">Выберите соревнование:</label>
                    <select id="selectCompetitionResults" onchange="loadResults()">
                        <option value="">-- Выберите соревнование --</option>
                    </select>
                </div>
            </div>

            <div id="resultsArea">
                <div class="results-table">
                    <h3>Итоговая таблица результатов</h3>
                    <div id="resultsTable"></div>
                </div>

                <div class="winners-podium">
                    <h3>🏆 Победители</h3>
                    <div id="winnersPodium"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
